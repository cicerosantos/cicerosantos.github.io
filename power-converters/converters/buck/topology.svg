<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" role="img" aria-label="Synchronous buck: input source, high-side and low-side switches, inductor, output capacitor and load; the firmware samples the output with its ADC and drives both gates from its PWM">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" style="stroke:var(--text)">
    <!-- input source -->
    <path d="M40 34 V64 M40 84 V120"/>
    <path d="M28 64 H52 M33 71 H47 M28 77 H52 M33 84 H47" stroke-width="2"/>
    <!-- high-side switch Q1, in the top rail -->
    <path d="M40 34 H104 V26 M136 26 V34 H226"/>
    <path d="M102 26 H112 M115 26 H125 M128 26 H138" stroke-width="2.4"/>
    <path d="M106 19 H134" stroke-width="2" style="stroke:var(--hg)"/>
    <path d="M120 19 V9" style="stroke:var(--hg)"/>
    <!-- low-side switch Q2, from the switch node to ground -->
    <path d="M170 34 V60 H178 M178 88 H170 V120"/>
    <path d="M178 58 V68 M178 71 V77 M178 80 V90" stroke-width="2.4"/>
    <path d="M185 62 V86" stroke-width="2" style="stroke:var(--lg)"/>
    <path d="M185 74 H197" style="stroke:var(--lg)"/>
    <!-- inductor -->
    <path d="M226 34 a8 8 0 0 1 16 0 a8 8 0 0 1 16 0 a8 8 0 0 1 16 0 a8 8 0 0 1 16 0" stroke-width="2" style="stroke:var(--il)"/>
    <path d="M290 34 H370"/>
    <!-- output capacitor -->
    <path d="M316 34 V70 M316 80 V120"/>
    <path d="M304 70 H328 M304 80 H328" stroke-width="2.4"/>
    <!-- load -->
    <path d="M356 34 V50 l7 4 l-14 8 l14 8 l-14 8 l14 8 l-7 4 V120"/>
    <!-- ground rail, the reference under the input source -->
    <path d="M40 120 H356 M40 120 V127 M31 127 H49 M34 131 H46 M37 135 H43"/>
  </g>
  <g style="fill:var(--text)">
    <circle cx="170" cy="34" r="2.6"/><circle cx="316" cy="34" r="2.6"/><circle cx="316" cy="120" r="2.6"/><circle cx="170" cy="120" r="2.6"/>
    <circle cx="370" cy="34" r="3" style="fill:var(--vout)"/>
  </g>
  <!-- firmware: the ADC samples V(out), the control law runs, the PWM drives HG and LG -->
  <rect x="384" y="56" width="90" height="60" rx="5" fill="none" stroke-width="1.3" style="stroke:var(--muted)"/>
  <g fill="none" stroke-width="1.3" stroke-dasharray="4 3">
    <path d="M370 34 H404 V56" style="stroke:var(--vout)"/>
    <path d="M456 56 V9 H120" style="stroke:var(--hg)"/>
    <path d="M456 116 V132 H205 V125 M205 115 V74 H197" style="stroke:var(--lg)"/>
  </g>
  <!-- LG hops over the ground rail -->
  <path d="M205 125 a5 5 0 0 1 0 -10" fill="none" stroke-width="1.3" stroke-linecap="round" style="stroke:var(--lg)"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" style="fill:var(--muted)">
    <text x="58" y="80">V</text><text x="68" y="84" font-size="11">in</text>
    <text x="108" y="54">Q1</text><text x="134" y="80">Q2</text>
    <text x="250" y="58" style="fill:var(--il)">L</text>
    <text x="287" y="80">C</text><text x="367" y="80">R</text>
    <text x="372" y="25" style="fill:var(--vout)">V</text><text x="382" y="29" font-size="11" style="fill:var(--vout)">out</text>
    <text x="429" y="85" text-anchor="middle" font-size="13" font-weight="600" style="fill:var(--text)">firmware</text>
    <g font-size="11" text-anchor="middle">
      <text x="404" y="68" style="fill:var(--vout)">ADC</text>
      <text x="456" y="68" style="fill:var(--hg)">HG</text>
      <text x="456" y="111" style="fill:var(--lg)">LG</text>
      <text x="429" y="98" font-size="10">control · PWM</text>
    </g>
  </g>
</svg>
