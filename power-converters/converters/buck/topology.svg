<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 0 424 268" role="img" aria-label="Synchronous buck: input source feeding a half-bridge leg of high-side and low-side switches, inductor from the switch node to the output capacitor and load; the firmware, drawn below it, samples the output with its ADC and drives both gates from its PWM">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" style="stroke:var(--text)">
    <!-- input source, top rail to the top of the leg -->
    <path d="M156 26 V89 M156 97 V160 M156 26 H236"/>
    <path d="M144 89 H168 M149 97 H163" stroke-width="2"/>
    <!-- half-bridge leg: high-side switch Q1, gate on the left -->
    <path d="M236 26 V47 H228 M228 75 H236 V96"/>
    <path d="M228 45 V77" stroke-width="2.4"/>
    <path d="M221 55 V77" stroke-width="2" style="stroke:var(--hg)"/>
    <path d="M221 77 H209" style="stroke:var(--hg)"/>
    <!-- half-bridge leg: low-side switch Q2, gate on the left -->
    <path d="M236 96 V114 H228 M228 142 H236 V160"/>
    <path d="M228 112 V144" stroke-width="2.4"/>
    <path d="M221 122 V144" stroke-width="2" style="stroke:var(--lg)"/>
    <path d="M221 144 H209" style="stroke:var(--lg)"/>
    <!-- inductor, from the switch node -->
    <path d="M236 96 H267 M321 96 H430"/>
    <path d="M267 96 a9 9 0 0 1 18 0 a9 9 0 0 1 18 0 a9 9 0 0 1 18 0" stroke-width="2" style="stroke:var(--il)"/>
    <!-- output capacitor -->
    <path d="M356 96 V121 M356 129 V160"/>
    <path d="M344 121 H368 M344 129 H368" stroke-width="2.4"/>
    <!-- load -->
    <path d="M400 96 V112 l6 4 l-12 8 l12 8 l-12 8 l6 4 V160"/>
    <!-- ground rail, the reference under the input source -->
    <path d="M156 160 H400 M156 160 V174 M147 174 H165 M150 178 H162 M153 182 H159"/>
  </g>
  <g style="fill:var(--text)">
    <circle cx="236" cy="96" r="2.6"/><circle cx="356" cy="96" r="2.6"/><circle cx="400" cy="96" r="2.6"/><circle cx="356" cy="160" r="2.6"/><circle cx="236" cy="160" r="2.6"/><circle cx="156" cy="160" r="2.6"/>
    <circle cx="430" cy="96" r="3" style="fill:var(--vout)"/>
  </g>
  <!-- firmware, below the power stage: the ADC samples V(out), the PWM drives HG and LG -->
  <rect x="162" y="186" width="76" height="56" rx="5" fill="none" stroke-width="1.3" style="stroke:var(--muted)"/>
  <g fill="none" stroke-width="1.3" stroke-dasharray="4 3">
    <path d="M430 96 V228 H238" style="stroke:var(--vout)"/>
    <path d="M209 77 H180 V186" style="stroke:var(--hg)"/>
    <path d="M209 144 V186" style="stroke:var(--lg)"/>
  </g>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" style="fill:var(--muted)">
    <text x="118" y="99">V</text><text x="128" y="103" font-size="11">in</text>
    <text x="246" y="66">Q1</text><text x="246" y="133">Q2</text>
    <text x="294" y="120" text-anchor="middle" style="fill:var(--il)">L</text>
    <text x="331" y="130">C</text><text x="414" y="132">R</text>
    <text x="438" y="92" style="fill:var(--vout)">V</text><text x="448" y="96" font-size="11" style="fill:var(--vout)">out</text>
    <text x="200" y="259" text-anchor="middle" font-size="13" font-weight="600" style="fill:var(--text)">firmware</text>
    <g font-size="11" text-anchor="middle">
      <text x="180" y="199" style="fill:var(--hg)">HG</text>
      <text x="209" y="199" style="fill:var(--lg)">LG</text>
      <text x="194" y="215" font-size="10">PWM</text>
      <text x="233" y="232" text-anchor="end" style="fill:var(--vout)">ADC</text>
    </g>
  </g>
</svg>
