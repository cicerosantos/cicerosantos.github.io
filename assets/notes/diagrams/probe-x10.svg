    <path d="M30 172 L30 178"/>
    <path d="M21 178 H39 M24.5 182 H35.5 M28 186 H32"/>
  </g>
  <g fill="none" stroke-width="1.2" stroke-dasharray="5 4" style="stroke:var(--muted)">
    <rect x="60" y="40" width="134" height="118" rx="6"/>
    <rect x="254" y="40" width="202" height="160" rx="6"/>
  </g>
  <g stroke-width="1.6" style="stroke:var(--text);fill:var(--bg)">
    <circle cx="444" cy="104" r="3.4"/>
  </g>
  <g style="fill:var(--text)">
    <circle cx="92" cy="104" r="2.6"/>
