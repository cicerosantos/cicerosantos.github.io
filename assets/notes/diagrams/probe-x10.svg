<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 230" aria-hidden="true">
  <!-- The x10 passive probe: the source u (the circuit or the calibrator), the tip R1 in parallel with C1, the cable (a wire here; its capacitance is in C2) to the oscilloscope's input, R2 in parallel with C2 (input, cable and trimmer) -->
