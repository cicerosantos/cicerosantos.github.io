    <circle cx="290" cy="172" r="2.6"/>
    <circle cx="360" cy="172" r="2.6"/>
  </g>
  <!-- labels; Portuguese (l-pt) and English (l-en) where they differ: the notes show one set by the page's language -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" style="fill:var(--text)">
    <text x="127" y="34" text-anchor="middle" font-size="13" font-weight="600" class="l-pt" style="fill:var(--muted)">ponta ×10</text>
    <text x="127" y="34" text-anchor="middle" font-size="13" font-weight="600" class="l-en" style="fill:var(--muted)">×10 probe tip</text>
    <text x="355" y="34" text-anchor="middle" font-size="13" font-weight="600" class="l-pt" style="fill:var(--muted)">conector + osciloscópio</text>
    <text x="355" y="34" text-anchor="middle" font-size="13" font-weight="600" class="l-en" style="fill:var(--muted)">connector box + scope</text>
    <text x="24" y="96" text-anchor="end"><tspan font-style="italic">u</tspan></text>
    <text x="134" y="130" text-anchor="middle"><tspan font-style="italic">R</tspan><tspan font-size="10" dy="4">1</tspan></text>
    <text x="134" y="148" text-anchor="middle" font-size="12" style="fill:var(--muted)">9 MΩ</text>
    <text x="112" y="52" text-anchor="middle"><tspan font-style="italic">C</tspan><tspan font-size="10" dy="4">1</tspan></text>
    <text x="156" y="52" text-anchor="middle" font-size="12" style="fill:var(--muted)">22 pF</text>
    <text x="224" y="80" text-anchor="middle" font-size="12" class="l-pt" style="fill:var(--muted)">cabo</text>
    <text x="224" y="94" text-anchor="middle" font-size="11" class="l-pt" style="fill:var(--muted)">(em C<tspan font-size="8" dy="3">2</tspan>)</text>
    <text x="224" y="80" text-anchor="middle" font-size="12" class="l-en" style="fill:var(--muted)">cable</text>
    <text x="224" y="94" text-anchor="middle" font-size="11" class="l-en" style="fill:var(--muted)">(in C<tspan font-size="8" dy="3">2</tspan>)</text>
    <text x="302" y="136" text-anchor="start"><tspan font-style="italic">R</tspan><tspan font-size="10" dy="4">2</tspan></text>
    <text x="302" y="152" text-anchor="start" font-size="12" style="fill:var(--muted)">1 MΩ</text>
    <text x="376" y="136" text-anchor="start"><tspan font-style="italic">C</tspan><tspan font-size="10" dy="4">2</tspan></text>
    <text x="376" y="152" text-anchor="start" font-size="12" class="l-pt" style="fill:var(--muted)">100–300 pF</text>
    <text x="376" y="152" text-anchor="start" font-size="12" class="l-en" style="fill:var(--muted)">100–300 pF</text>
    <text x="442" y="94" text-anchor="middle"><tspan font-style="italic">y</tspan></text>
    <text x="350" y="220" text-anchor="middle" font-size="12" class="l-pt" style="fill:var(--muted)">C<tspan font-size="9" dy="3">2</tspan><tspan dy="-3">: entrada + cabo + </tspan><tspan font-style="italic">trimmer</tspan></text>
    <text x="350" y="220" text-anchor="middle" font-size="12" class="l-en" style="fill:var(--muted)">C<tspan font-size="9" dy="3">2</tspan><tspan dy="-3">: input + cable + trimmer</tspan></text>
  </g>
</svg>
